apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ssh-sign

resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

images:
  - name: ssh-sign
    newTag: GIT_HASH

