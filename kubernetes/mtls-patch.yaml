apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-sign
  namespace: ssh-sign
spec:
  template:
    spec:
      containers:
        - name: ssh-sign
          env:
            - name: VAULT_MTLS
              value: "true"
            - name: VAULT_CACERT
              value: /certs/ca.crt
            - name: VAULT_CLIENT_CERT
              value: /certs/client.crt
            - name: VAULT_CLIENT_KEY
              value: /certs/client.key
          volumeMounts:
            - name: vault-mtls
              mountPath: /certs
              readOnly: true
      volumes:
        - name: vault-mtls
          secret:
            secretName: ssh-sign-vault-mtls
            items:
              - key: ca.crt
                path: ca.crt
              - key: client.crt
                path: client.crt
              - key: client.key
                path: client.key
