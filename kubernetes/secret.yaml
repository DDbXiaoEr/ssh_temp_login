apiVersion: v1
kind: Secret
metadata:
  name: ssh-sign-vault
  namespace: ssh-sign
type: Opaque
stringData:
  VAULT_ADDR: "https://vault.example.com:8200"
  VAULT_TOKEN: "CHANGE_ME"
  VAULT_ROLE: "user-cert"
  VAULT_MOUNT: "ssh"
  VAULT_NAMESPACE: ""
  VAULT_DEFAULT_PRINCIPALS: "root"
  VAULT_TLS_SKIP_VERIFY: "false"
