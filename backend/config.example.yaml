server:
  addr: ":8080"
  # 允许的前端来源，开发时保留 Vite 默认端口
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
    - "https://localhost:5173"
    - "https://127.0.0.1:5173"
  # 本服务作为 HTTPS 服务端：只需下面三项，不要配 client.crt / client.key。
  # 不配 cert/key 则走明文 HTTP；配上后启用 HTTPS。
  # client_ca_file 是用来校验客户端的 CA（不是客户端证书）。
  # 再配 client_ca_file 即开启 mTLS。服务端证书建议用 fullchain（leaf + CA）。
  tls:
    cert_file: ""
    key_file: ""
    client_ca_file: ""
    require_client_cert: true

vault:
  # 可选的签发角色列表。前端会按这里的 description 展示类型供用户选择。
  # 配置了 vault.roles 后，VAULT_ROLE 环境变量会被忽略；
  # VAULT_ADDR / VAULT_TOKEN 仍然只从环境变量读取。
  roles:
    - role: "user-cert"
      description: "日常登录：允许 root，证书 10 分钟有效"
      default_principals: "root"
    - role: "readonly"
      description: "只读排障：允许 readonly 用户，证书 5 分钟有效"
      default_principals: "readonly"

  # 本服务作为 Vault 客户端时使用的 TLS 配置。
  # 只有 Vault 开启了 mTLS 才需要填下面三项证书。
  # 环境变量 VAULT_MTLS / VAULT_TLS_SKIP_VERIFY / VAULT_CACERT / VAULT_CLIENT_CERT / VAULT_CLIENT_KEY
  # 会覆盖这里的同名配置。
  mtls: false
  tls_skip_verify: false
  ca_cert: ""
  client_cert: ""
  client_key: ""
